<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ location.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #0ff;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 900px;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px #0ff;
        }

        .location-info {
            width: 50%;
            padding-right: 30px;
        }

        h2 {
            font-size: 26px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }

        p {
            font-size: 16px;
            margin: 10px 0;
        }

        .booking-form {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #0ff;
            border-radius: 5px;
            background-color: black;
            color: #0ff;
            outline: none;
        }

        input::placeholder {
            color: #088;
        }

        .btn {
            background-color: transparent;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0ff;
            color: black;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0ff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #0ff;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
        }

        .back-link:hover {
            background-color: #0ff;
            color: black;
        }

        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="location-info">
            <h2>{{ location.title }}</h2>
            <p><strong>Ціна:</strong> {{ location.price }} грн</p>
            <p><strong>Місткість:</strong> {{ location.capacity }} осіб</p>
            <p><strong>Опис:</strong> {{ location.description }}</p>
        </div>
        <div class="booking-form">
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <label for="email">Ваш Email:</label>
                <input type="email" name="email" required placeholder="example@email.com">

                <label for="start_date">Дата початку:</label>
                <input type="date" name="start_date" required>

                <label for="end_date">Дата завершення:</label>
                <input type="date" name="end_date" required>

                <button type="submit" class="btn">Забронювати</button>
            </form>
            <a href="{% url 'create_booking' %}" class="back-link">Назад до локацій</a>
        </div>
    </div>
</body>
</html>
