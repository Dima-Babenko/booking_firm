<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px cyan;
            animation: glow 1.5s infinite alternate;
            position: relative;
            z-index: 2;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px cyan; }
            to { box-shadow: 0 0 20px cyan, 0 0 30px cyan; }
        }
        h2 { font-size: 28px; text-shadow: 0 0 10px cyan; }
        input {
            padding: 10px;
            width: 100%;
            border: none;
            outline: none;
            background: black;
            color: white;
            border-bottom: 2px solid cyan;
            margin: 5px 0;
            text-align: center;
        }
        button {
            background: black;
            color: cyan;
            border: 2px solid cyan;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 10px cyan;
        }
        a {
            color: cyan;
            text-decoration: none;
            transition: 0.3s;
        }
        a:hover { text-shadow: 0 0 10px cyan; }
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: cyan;
            border-radius: 50%;
            opacity: 0.8;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(1); opacity: 0; }
            to { transform: translateY(-10vh) scale(0.5); opacity: 1; }
        }
        .errorlist {
            color: red;
            font-size: 12px;
            padding: 0;
            margin: 5px 0;
            list-style: none;
        }
        label {
            display: block;
            margin-top: 10px;
            text-shadow: 0 0 5px cyan;
        }
    </style>
</head>
<body>
    <div class="particles"></div>

    <div class="container">
        <h2>Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">Ім'я користувача:</label>
            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.email.id_for_label }}">Email:</label>
            {{ form.email }}
            {{ form.email.errors }}

            <label for="{{ form.password1.id_for_label }}">Пароль:</label>
            {{ form.password1 }}
            {{ form.password1.errors }}

            <label for="{{ form.password2.id_for_label }}">Підтвердження паролю:</label>
            {{ form.password2 }}
            {{ form.password2.errors }}

            <button type="submit">Зареєструватися</button>
        </form>
        <p>Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
    </div>

    <script>
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            for (let i = 0; i < 50; i++) {
                let particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 5 + 3}s`;
                particle.style.animationDelay = `-${Math.random() * 5}s`;
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
