<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Доступні локації</title>
</head>
<body>
    <h2>Доступні локації</h2>
    <a href="{% url 'dashboard' %}"><button>Назад</button></a>

    <ul>
        {% for location in locations %}
            <li>
                <h4>{{ location.title }}</h4>
                <p>Ціна: {{ location.price }} грн</p>
                <p>Місткість: {{ location.capacity }} осіб</p>
                <p>Опис: {{ location.description }}</p>
                <a href="{% url 'location_detail' location.id %}"><button>Оглянути</button></a>
            </li>
        {% empty %}
            <p>Немає доступних локацій.</p>
        {% endfor %}
    </ul>
</body>
</html>
